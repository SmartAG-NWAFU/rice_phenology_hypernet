<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title desc">
  <title id="title">Process-preserving daily development-rate correction for rice phenology</title>
  <desc id="desc">DRC and CDRC multiply normalized PBM-PT daily development rates by exp(clip(f, -2, 2)). Corrected rates accumulate to one to predict each transition endpoint. PBM-T and PBM-PT are process baselines. Evaluation uses random site-year, unseen-site, and later-year tasks. Sequential rollout proceeds from reviving through maturity with a 120-day search window and final-valid-day fallback. Curves are conceptual illustrations, not experimental results.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #203449; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #527084; }
      .heading { font-size: 30px; font-weight: 700; }
      .panel-title { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526477; }
      .formula { font-size: 24px; font-family: Georgia, 'Times New Roman', serif; }
      .blue { fill: #155b94; }
      .orange { fill: #ad510a; }
      .green { fill: #3d682d; }
      .axis { fill: none; stroke: #8292a1; stroke-width: 1.5; }
      .baseline { fill: none; stroke: #155b94; stroke-width: 3; }
      .correction { fill: none; stroke: #ca6816; stroke-width: 3; }
      .guide { fill: none; stroke: #8292a1; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#527084" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1440" height="910" rx="20" fill="#ffffff"/>
  <text x="40" y="43" class="eyebrow">RICE PHENOLOGY · SCIENTIFIC FRAMEWORK</text>
  <text x="40" y="87" class="heading">Learn the daily correction. Preserve the development process.</text>
  <text x="40" y="119" class="body">Weather history informs the modifier; accumulated development determines the stage date.</text>

  <rect x="40" y="152" width="316" height="358" rx="16" fill="#f3f7fb" stroke="#b9cede"/>
  <rect x="388" y="152" width="316" height="358" rx="16" fill="#fff8ef" stroke="#e5c29d"/>
  <rect x="736" y="152" width="316" height="358" rx="16" fill="#f3f7fb" stroke="#b9cede"/>
  <rect x="1084" y="152" width="316" height="358" rx="16" fill="#f3f7fb" stroke="#b9cede"/>
  <g fill="none" stroke="#527084" stroke-width="2" marker-end="url(#arrow)">
    <path d="M359 330 H381"/><path d="M707 330 H729"/><path d="M1055 330 H1077"/>
  </g>
  <text x="62" y="187" class="eyebrow">01 / PROCESS BACKBONE</text>
  <text x="62" y="224" class="panel-title">Normalize development</text>
  <text x="62" y="258" class="body">Temperature + daylength</text>
  <text x="62" y="289" class="formula blue">DVR₀ = DV / TR</text>
  <path d="M75 410 V324 M75 410 H324" class="axis"/>
  <path d="M85 400 L145 338 L240 338 L302 400" class="baseline"/>
  <text x="121" y="434" class="small">Thermal response (schematic)</text>
  <text x="62" y="465" class="body">PBM-PT backbone for DRC/CDRC</text>
  <text x="62" y="491" class="small">Training-derived requirements (TR)</text>

  <text x="410" y="187" class="eyebrow orange">02 / DAILY MODIFIER</text>
  <text x="410" y="224" class="panel-title">Learn a bounded correction</text>
  <text x="410" y="258" class="body">GRU + transition-specific heads</text>
  <text x="410" y="289" class="formula orange">m = exp(clip(f, −2, 2))</text>
  <text x="410" y="324" class="body">e⁻² ≤ m ≤ e²</text>
  <path d="M427 410 V347 M427 410 H676" class="axis"/>
  <path d="M427 377 H676" class="guide"/>
  <text x="429" y="366" class="small">m = 1</text>
  <path d="M466 377 C478 348 491 353 503 377 S528 402 543 377 S565 350 580 377 S610 400 625 377 S648 362 672 377" class="correction"/>
  <text x="410" y="465" class="body">Below 1: slower · above 1: faster</text>
  <text x="410" y="491" class="small">CDRC adds gated stage-start context</text>

  <text x="758" y="187" class="eyebrow">03 / CORRECTED DVR</text>
  <text x="758" y="224" class="panel-title">Modify the daily rate</text>
  <text x="758" y="258" class="body">Positive multiplicative correction</text>
  <text x="758" y="289" class="formula blue">DVR* = m × DVR₀</text>
  <path d="M773 410 V324 M773 410 H1026" class="axis"/>
  <path d="M776 368 C795 328 811 382 833 364 S870 338 887 370 S921 387 940 361 S973 348 994 363 S1013 345 1024 351" class="baseline"/>
  <path d="M776 382 C795 354 811 395 833 374 S870 361 887 386 S921 400 940 378 S973 366 994 381 S1013 368 1024 374" class="correction"/>
  <text x="858" y="434" class="small">Time (days)</text>
  <path d="M758 461 H786" class="baseline"/><text x="795" y="467" class="small">Backbone</text>
  <path d="M901 461 H929" class="correction"/><text x="938" y="467" class="small">Corrected</text>
  <text x="758" y="491" class="small">Illustrative curves, not fitted results</text>

  <text x="1106" y="187" class="eyebrow">04 / STAGE COMPLETION</text>
  <text x="1106" y="224" class="panel-title">Accumulate to one</text>
  <text x="1106" y="258" class="body">First crossing → predicted date</text>
  <text x="1106" y="289" class="formula blue">Σ DVR* ≥ 1</text>
  <path d="M1121 410 V324 M1121 410 H1374" class="axis"/>
  <path d="M1121 354 H1374 M1290 354 V410" class="guide"/>
  <text x="1125" y="344" class="small">1</text>
  <path d="M1123 406 C1153 400 1165 387 1190 383 S1225 366 1251 363 S1281 356 1290 354 S1331 331 1370 327" class="baseline"/>
  <circle cx="1290" cy="354" r="5" fill="#155b94"/>
  <text x="1200" y="434" class="small">Time (days)</text>
  <text x="1106" y="465" class="body">Search window: up to 120 days</text>
  <text x="1106" y="491" class="small">No crossing: use the final valid day</text>

  <text x="40" y="551" class="eyebrow">FOUR MODEL FORMULATIONS</text>
  <rect x="40" y="567" width="1360" height="92" rx="14" fill="#f6f8f5" stroke="#cedac8"/>
  <path d="M373 585 V641 M714 585 V641 M1055 585 V641" stroke="#cedac8"/>
  <text x="62" y="600" class="panel-title blue">PBM-T</text>
  <text x="62" y="630" class="body">Thermal process baseline</text>
  <text x="395" y="600" class="panel-title blue">PBM-PT</text>
  <text x="395" y="630" class="body">Photothermal process baseline</text>
  <text x="736" y="600" class="panel-title orange">DRC</text>
  <text x="736" y="630" class="body">PBM-PT + weather-driven modifier</text>
  <text x="1077" y="600" class="panel-title green">CDRC</text>
  <text x="1077" y="630" class="body">DRC + constrained context</text>

  <text x="40" y="699" class="eyebrow">GENERALIZATION TESTS</text>
  <text x="300" y="699" class="body">Random site-year</text>
  <text x="556" y="699" class="body">Unseen-site</text>
  <text x="770" y="699" class="body">Later-year</text>
  <text x="1032" y="699" class="small">Interpolation · spatial · temporal transfer</text>

  <rect x="40" y="727" width="1360" height="116" rx="14" fill="#f6f8f5" stroke="#cedac8"/>
  <text x="62" y="759" class="eyebrow green">SEQUENTIAL ROLLOUT</text>
  <g class="body" text-anchor="middle">
    <text x="146" y="797">Reviving</text><text x="365" y="797">Tillering</text>
    <text x="584" y="797">Jointing</text><text x="803" y="797">Booting</text>
    <text x="1022" y="797">Heading</text><text x="1241" y="797">Maturity</text>
  </g>
  <g stroke="#527084" stroke-width="2" marker-end="url(#arrow)">
    <path d="M207 791 H293"/><path d="M426 791 H512"/><path d="M645 791 H731"/><path d="M864 791 H950"/><path d="M1083 791 H1169"/>
  </g>
  <text x="62" y="826" class="small">Initialize at reviving; each subsequent transition begins on the day after the predicted endpoint.</text>
  <text x="40" y="879" class="small">Conceptual guide • Photoperiod suppression in PBM-PT applies to jointing–booting and booting–heading only.</text>
</svg>
